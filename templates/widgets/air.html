{{ define "content" }}
<div class="tile">
	{{ if .available }}
		<div class="primary">AQI {{ .aqi }} · {{ .category }}</div>
		<div class="detail">US air quality index · {{ .place }}</div>
	{{ else }}
		<div class="primary">Air quality unavailable</div>
		<div class="detail">Check the city and try again later</div>
	{{ end }}
</div>
{{ end }}
