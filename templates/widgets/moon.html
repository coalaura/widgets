{{ define "content" }}
<div class="tile">
	<div class="primary sky-primary">
		<svg class="sky-icon" viewBox="0 0 32 32" aria-hidden="true">
			<circle cx="16" cy="16" r="14" fill="currentColor" opacity="0.16" />
			<path id="moon-lit" fill="currentColor" />
			<circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" opacity="0.5" />
		</svg>
		<span id="moon-phase" class="sky-label"></span>
	</div>
	<div id="moon-light" class="detail"></div>
</div>

<script>
	const moonPhases = ["New moon", "Waxing crescent", "First quarter", "Waxing gibbous", "Full moon", "Waning gibbous", "Last quarter", "Waning crescent"];

	function refreshMoon() {
		// Mean lunar cycle from the new moon on January 6, 2000 at 18:14 UTC.
		const cycle = 29.530588853 * 86400000,
			phase = (((Date.now() - Date.UTC(2000, 0, 6, 18, 14)) % cycle) + cycle) % cycle / cycle,
			index = Math.round(phase * 8) % 8,
			illumination = Math.round((1 - Math.cos(phase * 2 * Math.PI)) * 50),
			terminator = Math.max(0.001, Math.abs(Math.cos(phase * 2 * Math.PI)) * 14),
			outerSide = phase < 0.5 ? 1 : 0,
			innerSide = phase < 0.25 || phase >= 0.5 && phase < 0.75 ? 0 : 1;

		// The outer semicircle is the lunar edge; the inner ellipse is the moving terminator.
		document.getElementById("moon-lit").setAttribute("d", `M16 2 A14 14 0 0 ${outerSide} 16 30 A${terminator} 14 0 0 ${innerSide} 16 2 Z`);
		document.getElementById("moon-phase").textContent = moonPhases[index];
		document.getElementById("moon-light").textContent = `About ${illumination}% illuminated`;
	}

	refreshMoon();
	setInterval(refreshMoon, 3600000);
</script>
{{ end }}
