<!DOCTYPE html>
<html>
	<head>
		<title>Widget</title>

		<style>
			@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap");

			* {
				box-sizing: border-box;
				user-select: none;
			}

			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: {{ .align }};
				background: transparent;
				font-family: {{ .font | js }}, "JetBrains Mono", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
				font-size: {{ .size }};
				color: {{ .color }};
			}

			.wrapper > div {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			img {
				width: 100%;
			}

			.value {
				display: flex;
  				align-items: center;
				font-weight: {{ .weight }};
				text-align: {{ .align }};
				justify-content: {{ .align }};
			}

			.pre {
				white-space: pre;
			}

			.tile {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: {{ if eq .align "left" }}flex-start{{ else if eq .align "right" }}flex-end{{ else }}center{{ end }};
				gap: 0.15em;
				font-weight: {{ .weight }};
				text-align: {{ .align }};
			}

			.tile .primary,
			.tile .detail {
				max-width: 100%;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.tile .detail {
				font-size: 0.78em;
				opacity: 0.8;
			}

			.sky-primary {
				display: flex;
				align-items: center;
				gap: 0.35em;
			}

			.sky-icon {
				width: 1.3em;
				height: 1.3em;
				flex: none;
			}

			.sky-label {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			textarea {
				border: none;
				background: transparent;
				color: inherit;
				font-size: inherit;
				width: 100%;
				height: 100%;
				padding: 2px;
				resize: none;
			}
		</style>

		<script>
			const _ = {{ . | json }};

			function format() {
				return _.format.replace(/\{\s*(\w+)\s*}/g, (match, key) => {
					if (key in _) {
						return _[key];
					}

					return match;
				});
			}

			function round(val, decimals = 1) {
				const fixed = val.toFixed(decimals);

				return decimals === 0 ? fixed : fixed.replace(/\.?0+$/, '');
			}
		</script>
	</head>

	<body class="wrapper">
		{{ block "content" . }}{{ end }}

		<script>
			if (typeof tick !== "undefined") {
				tick();

				const fps = 1000 / Math.min(Math.max({{ .fps }}, 1), 30);

				setInterval(tick, Math.floor(fps));
			}

			if ("serviceWorker" in navigator) {
				navigator.serviceWorker.register("/worker.js");
			}
		</script>
	</body>
</html>
